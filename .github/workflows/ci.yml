name: Engine tests (offline only)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free dependency
        run: python -m pip install -r requirements.txt
      - name: Compile engine
        run: python -m compileall -q engine
      - name: Run deterministic unit tests (no live API)
        run: python -m unittest discover -s tests -v
