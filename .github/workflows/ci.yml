name: Engine tests (offline only)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free dependency
        run: python -m pip install -r requirements.txt
      - name: Compile engine
        run: python -m compileall -q engine research
      - name: Run deterministic unit tests (no live API)
        run: python -m unittest discover -s tests -v
      - name: Reproduce frozen funding event study
        run: python -m research.funding_event_study --data research/data/binance_btcusdt_2026-05-01_to_2026-11-20.json --output-dir output/study
      - name: Save reproducible event-study artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-event-study-offline
          path: output/study/
          if-no-files-found: warn
          retention-days: 30
      - name: Run multi-year frozen funding study
        run: python -m research.multiyear_event_study --output-dir output/multiyear
      - name: Save multi-year study results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-multi-year-analysis
          path: output/multiyear/
          if-no-files-found: warn
          retention-days: 30
      - name: Run causal SH-BMS-RTO long-only proxy study
        run: python -m research.causal_structure_backtest --output-dir output/structure
      - name: Save causal structure study artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-backtest-research
          path: output/structure/
          if-no-files-found: warn
          retention-days: 30
      - name: Run five-step observable strategy A/B long-short backtest
        run: python -m research.five_step_observable_backtest --output-dir output/five_step
      - name: Keep 5-step metrics and every simulated trade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-five-step-long-short-backtest
          path: output/five_step/
          if-no-files-found: warn
          retention-days: 30
      - name: Independent long funding study by year
        run: python -m research.focus_long_report --input output/five_step/results.json --output-dir output/long_focus
      - name: Preserve independent long-only vs funding report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-independent-long-funding-focus
          path: output/long_focus/
          if-no-files-found: warn
          retention-days: 30
